name: Performance Benchmark
run-name: "Benchmark PR #${{ inputs.pr_number }} (${{ inputs.preset }})"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number from opentelemetry-js to benchmark'
        required: true
        type: string
      scenarios:
        description: 'Test scenarios (comma-separated or "all")'
        required: false
        default: 'simple-json'
        type: string
      apps:
        description: 'Applications to test (express, fastify, or all)'
        required: false
        default: 'express'
        type: string
      modes:
        description: 'Instrumentation modes (baseline, otel-noop, otel-console, otel-otlp-http, or all)'
        required: false
        default: 'baseline,otel-noop'
        type: string
      preset:
        description: 'Benchmark preset (quick, standard, stress)'
        required: false
        default: 'standard'
        type: string

jobs:
  # Determine baseline tag and build the matrix
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      baseline_tag: ${{ steps.release.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Get latest opentelemetry-js release tag
        id: release
        run: |
          LATEST_TAG=$(gh api repos/open-telemetry/opentelemetry-js/releases/latest --jq '.tag_name' 2>/dev/null || echo "main")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest release: $LATEST_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build matrix
        id: matrix
        run: |
          # Build apps array
          if [ "${{ inputs.apps }}" = "all" ]; then
            APPS='["express", "fastify"]'
          else
            APPS='["${{ inputs.apps }}"]'
          fi

          # Build modes array
          if [ "${{ inputs.modes }}" = "all" ]; then
            MODES='["baseline", "otel-noop", "otel-console", "otel-otlp-http"]'
          else
            # Convert comma-separated to JSON array
            MODES=$(echo '${{ inputs.modes }}' | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')
          fi

          MATRIX="{\"app\": $APPS, \"mode\": $MODES, \"type\": [\"baseline\", \"pr\"]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

  # Run benchmarks in parallel (sharded by app, mode, and type)
  benchmark:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Checkout opentelemetry-js repo
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-js
          path: opentelemetry-js
          ref: ${{ matrix.type == 'baseline' && needs.setup.outputs.baseline_tag || format('refs/pull/{0}/head', inputs.pr_number) }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Get commit info
        id: commit_info
        run: |
          cd opentelemetry-js
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "short=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "Commit: $COMMIT_SHORT"

      - name: Install perf-experiments dependencies
        run: npm ci

      - name: Build perf-experiments
        run: npm run build

      - name: Install and build otel-js
        run: |
          cd opentelemetry-js
          npm ci
          npm run compile

      - name: Run benchmark
        run: |
          LABEL="${{ matrix.type == 'baseline' && format('baseline-{0}', needs.setup.outputs.baseline_tag) || format('pr-{0}', inputs.pr_number) }}"
          npm run cli -- run \
            --app ${{ matrix.app }} \
            --mode ${{ matrix.mode }} \
            --scenario ${{ inputs.scenarios }} \
            --preset ${{ inputs.preset }} \
            --label "$LABEL" \
            --otel-path ./opentelemetry-js \
            --save

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.type }}-${{ matrix.app }}-${{ matrix.mode }}
          path: results/
          retention-days: 1

  # Compare results and create report
  compare:
    needs: [setup, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true

      - name: Compare results
        id: compare
        run: |
          npm run cli -- compare \
            --baseline "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --target "pr-${{ inputs.pr_number }}" \
            --format markdown > comparison.md
          cat comparison.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-pr-${{ inputs.pr_number }}
          path: |
            results/
            comparison.md
          retention-days: 90

      - name: Create GitHub Issue with results
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run cli -- report \
            --baseline "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --target "pr-${{ inputs.pr_number }}" \
            --create-issue \
            --pr ${{ inputs.pr_number }} \
            --artifact-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --owner "open-telemetry" \
            --repo "opentelemetry-js"

      - name: Print summary
        run: |
          echo "## Benchmark Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline**: ${{ needs.setup.outputs.baseline_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: #${{ inputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          cat comparison.md >> $GITHUB_STEP_SUMMARY
