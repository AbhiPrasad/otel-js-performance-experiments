name: Performance Benchmark
run-name: "Benchmark PR #${{ inputs.pr_number }} (${{ inputs.preset }})"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number from opentelemetry-js to benchmark'
        required: true
        type: string
      scenarios:
        description: 'Test scenarios (comma-separated or "all")'
        required: false
        default: 'simple-json'
        type: string
      apps:
        description: 'Applications to test (express, fastify, or all)'
        required: false
        default: 'express'
        type: string
      modes:
        description: 'Instrumentation modes (baseline, otel-noop, otel-console, otel-otlp-http, or all)'
        required: false
        default: 'baseline,otel-noop'
        type: string
      preset:
        description: 'Benchmark preset (quick, standard, stress)'
        required: false
        default: 'standard'
        type: string

jobs:
  # Determine baseline tag and build the matrix
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      baseline_tag: ${{ steps.release.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Get latest opentelemetry-js release tag
        id: release
        run: |
          LATEST_TAG=$(gh api repos/open-telemetry/opentelemetry-js/releases/latest --jq '.tag_name' 2>/dev/null || echo "main")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest release: $LATEST_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build matrix
        id: matrix
        run: |
          # Build apps array
          if [ "${{ inputs.apps }}" = "all" ]; then
            APPS='["express", "fastify"]'
          else
            APPS='["${{ inputs.apps }}"]'
          fi

          # Build modes array
          if [ "${{ inputs.modes }}" = "all" ]; then
            MODES='["baseline", "otel-noop", "otel-console", "otel-otlp-http"]'
          else
            # Convert comma-separated to JSON array
            MODES=$(echo '${{ inputs.modes }}' | jq -R 'split(",") | map(gsub("^\\s+|\\s+$";""))')
          fi

          # Matrix without type - used by both benchmark jobs
          MATRIX="{\"app\": $APPS, \"mode\": $MODES}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

  # Build baseline otel-js (latest release)
  build-baseline:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout opentelemetry-js repo
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-js
          ref: ${{ needs.setup.outputs.baseline_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build otel-js
        run: |
          npm ci
          npm run compile

      - name: Upload built otel-js
        uses: actions/upload-artifact@v4
        with:
          name: otel-js-baseline
          path: |
            packages/*/build/
            packages/*/dist/
            experimental/packages/*/build/
            experimental/packages/*/dist/
            node_modules/
            package.json
            package-lock.json
          retention-days: 1

  # Build PR otel-js
  build-pr:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout opentelemetry-js repo
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-js
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build otel-js
        run: |
          npm ci
          npm run compile

      - name: Upload built otel-js
        uses: actions/upload-artifact@v4
        with:
          name: otel-js-pr
          path: |
            packages/*/build/
            packages/*/dist/
            experimental/packages/*/build/
            experimental/packages/*/dist/
            node_modules/
            package.json
            package-lock.json
          retention-days: 1

  # Run baseline benchmarks (starts as soon as build-baseline completes)
  benchmark-baseline:
    needs: [setup, build-baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install perf-experiments dependencies
        run: npm ci

      - name: Build perf-experiments
        run: npm run build

      - name: Download built otel-js
        uses: actions/download-artifact@v4
        with:
          name: otel-js-baseline
          path: opentelemetry-js/

      - name: Run benchmark
        run: |
          npm run cli -- run \
            --app ${{ matrix.app }} \
            --mode ${{ matrix.mode }} \
            --scenario ${{ inputs.scenarios }} \
            --preset ${{ inputs.preset }} \
            --label "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --otel-path ./opentelemetry-js \
            --save

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-baseline-${{ matrix.app }}-${{ matrix.mode }}
          path: results/
          retention-days: 1

  # Run PR benchmarks (starts as soon as build-pr completes)
  benchmark-pr:
    needs: [setup, build-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install perf-experiments dependencies
        run: npm ci

      - name: Build perf-experiments
        run: npm run build

      - name: Download built otel-js
        uses: actions/download-artifact@v4
        with:
          name: otel-js-pr
          path: opentelemetry-js/

      - name: Run benchmark
        run: |
          npm run cli -- run \
            --app ${{ matrix.app }} \
            --mode ${{ matrix.mode }} \
            --scenario ${{ inputs.scenarios }} \
            --preset ${{ inputs.preset }} \
            --label "pr-${{ inputs.pr_number }}" \
            --otel-path ./opentelemetry-js \
            --save

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-pr-${{ matrix.app }}-${{ matrix.mode }}
          path: results/
          retention-days: 1

  # Compare results and create report
  compare:
    needs: [setup, benchmark-baseline, benchmark-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true

      - name: Rebuild results index
        run: npm run cli -- rebuild-index

      - name: Compare results
        id: compare
        run: |
          npm run cli -- compare \
            --baseline "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --target "pr-${{ inputs.pr_number }}" \
            --format markdown > comparison.md
          cat comparison.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-pr-${{ inputs.pr_number }}
          path: |
            results/
            comparison.md
          retention-days: 90

      - name: Create GitHub Issue with results
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run cli -- report \
            --baseline "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --target "pr-${{ inputs.pr_number }}" \
            --create-issue \
            --pr ${{ inputs.pr_number }} \
            --artifact-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}"

      - name: Print summary
        run: |
          echo "## Benchmark Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline**: ${{ needs.setup.outputs.baseline_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: #${{ inputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          cat comparison.md >> $GITHUB_STEP_SUMMARY
