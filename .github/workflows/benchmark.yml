name: Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number from opentelemetry-js to benchmark'
        required: true
        type: string
      scenarios:
        description: 'Test scenarios (comma-separated or "all")'
        required: false
        default: 'simple-json'
        type: string
      apps:
        description: 'Applications to test (express, fastify, or all)'
        required: false
        default: 'express'
        type: string
      preset:
        description: 'Benchmark preset (quick, standard, stress)'
        required: false
        default: 'standard'
        type: string

jobs:
  # First job: determine the baseline tag
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      baseline_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Get latest opentelemetry-js release tag
        id: release
        run: |
          LATEST_TAG=$(gh api repos/open-telemetry/opentelemetry-js/releases/latest --jq '.tag_name' 2>/dev/null || echo "main")
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest release: $LATEST_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

  # Run baseline benchmark (latest release)
  baseline:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Checkout opentelemetry-js repo
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-js
          path: opentelemetry-js
          ref: ${{ needs.setup.outputs.baseline_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install perf-experiments dependencies
        run: npm ci

      - name: Build perf-experiments
        run: npm run build

      - name: Install and build otel-js
        run: |
          cd opentelemetry-js
          npm ci
          npm run compile

      - name: Run baseline benchmark
        run: |
          npm run cli -- run \
            --app ${{ inputs.apps }} \
            --scenario ${{ inputs.scenarios }} \
            --preset ${{ inputs.preset }} \
            --label "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --otel-path ./opentelemetry-js \
            --save

      - name: Upload baseline results
        uses: actions/upload-artifact@v4
        with:
          name: baseline-results
          path: results/
          retention-days: 1

  # Run PR benchmark (in parallel with baseline)
  pr:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_short: ${{ steps.pr_info.outputs.short }}
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Checkout opentelemetry-js repo
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-js
          path: opentelemetry-js
          ref: refs/pull/${{ inputs.pr_number }}/head

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Get PR commit info
        id: pr_info
        run: |
          cd opentelemetry-js
          PR_SHORT=$(git rev-parse --short HEAD)
          echo "short=$PR_SHORT" >> $GITHUB_OUTPUT
          echo "PR commit: $PR_SHORT"

      - name: Install perf-experiments dependencies
        run: npm ci

      - name: Build perf-experiments
        run: npm run build

      - name: Install and build otel-js
        run: |
          cd opentelemetry-js
          npm ci
          npm run compile

      - name: Run PR benchmark
        run: |
          npm run cli -- run \
            --app ${{ inputs.apps }} \
            --scenario ${{ inputs.scenarios }} \
            --preset ${{ inputs.preset }} \
            --label "pr-${{ inputs.pr_number }}" \
            --otel-path ./opentelemetry-js \
            --save

      - name: Upload PR results
        uses: actions/upload-artifact@v4
        with:
          name: pr-results
          path: results/
          retention-days: 1

  # Compare results and create report (after both benchmarks complete)
  compare:
    needs: [setup, baseline, pr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout performance experiments repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download baseline results
        uses: actions/download-artifact@v4
        with:
          name: baseline-results
          path: results/

      - name: Download PR results
        uses: actions/download-artifact@v4
        with:
          name: pr-results
          path: results/
          merge-multiple: true

      - name: Compare results
        id: compare
        run: |
          npm run cli -- compare \
            --baseline "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --target "pr-${{ inputs.pr_number }}" \
            --format markdown > comparison.md
          cat comparison.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-pr-${{ inputs.pr_number }}
          path: |
            results/
            comparison.md
          retention-days: 90

      - name: Create GitHub Issue with results
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run cli -- report \
            --baseline "baseline-${{ needs.setup.outputs.baseline_tag }}" \
            --target "pr-${{ inputs.pr_number }}" \
            --create-issue \
            --pr ${{ inputs.pr_number }} \
            --artifact-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --owner "open-telemetry" \
            --repo "opentelemetry-js"

      - name: Print summary
        run: |
          echo "## Benchmark Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline**: ${{ needs.setup.outputs.baseline_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: #${{ inputs.pr_number }} (${{ needs.pr.outputs.pr_short }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          cat comparison.md >> $GITHUB_STEP_SUMMARY
